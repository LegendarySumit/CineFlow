<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFlow | Production Crisis Director</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="bg-[#0D0B18] text-slate-100 font-sans antialiased h-screen flex overflow-hidden">

    <!-- LEFT SIDEBAR -->
    <aside class="w-72 bg-[#141024] border-r border-violet-900/30 flex flex-col overflow-hidden">
        <div class="flex-1 flex flex-col p-4 gap-4 overflow-hidden">
            <!-- Brand Header -->
            <div class="flex items-center gap-3 px-2 py-3">
                <div class="p-2.5 bg-gradient-to-br from-violet-600 to-indigo-600 rounded-xl text-white shadow-lg shadow-violet-900/50">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-base text-white tracking-tight">CineFlow</h1>
                    <p class="text-xs text-violet-400/70 font-mono">Crisis Director</p>
                </div>
            </div>

            <!-- New Crisis Button -->
            <button onclick="createNewSession()" class="flex items-center justify-center gap-2 w-full py-2.5 px-3 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 active:from-violet-700 active:to-indigo-700 text-white rounded-xl font-medium shadow-lg shadow-violet-900/40 transition-all duration-200">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>New Session</span>
            </button>

            <!-- Search -->
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-500"></i>
                <input id="session-search" type="text" placeholder="Search sessions..." class="w-full bg-[#1C1733] border border-violet-900/40 rounded-lg pl-9 pr-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500/50" />
            </div>

            <!-- Sessions List -->
            <div class="flex-1 overflow-hidden flex flex-col">
                <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 px-2 py-2">History</span>
                <div id="session-history-list" class="flex-1 overflow-y-auto pr-2 space-y-1.5">
                    <!-- Sessions loaded dynamically -->
                </div>
            </div>
        </div>

        <!-- Production Context Footer -->
        <div class="p-4 border-t border-violet-900/30 bg-[#100D1F] space-y-3">
            <div class="text-xs space-y-1">
                <p class="font-semibold text-slate-200">Project Aurora</p>
                <p class="text-slate-400 text-[11px]">Day 7 • Aug 25, 2026</p>
            </div>
            <div class="flex items-center justify-between text-[10px]">
                <span class="text-slate-500">Session ID</span>
                <span id="session-id-display" class="font-mono text-violet-400 bg-violet-950/40 px-2 py-0.5 rounded">#init</span>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col h-full bg-[#0D0B18] relative overflow-hidden">

        <!-- Top Status Bar -->
        <header class="h-12 border-b border-violet-900/30 flex items-center justify-between px-6 bg-[#0D0B18]/80 backdrop-blur-sm flex-shrink-0">
            <div class="flex items-center gap-3">
                <i data-lucide="bot" class="w-4 h-4 text-violet-400"></i>
                <span class="text-sm font-semibold text-slate-200">CineFlow Executive Assistant</span>
            </div>
            <div class="flex items-center gap-3 text-xs">
                <div class="flex items-center gap-1.5 px-3 py-1.5 bg-violet-950/50 border border-violet-800/40 rounded-lg font-mono">
                    <i data-lucide="trending-up" class="w-3 h-3 text-amber-400"></i>
                    <span class="text-slate-400">Budget:</span>
                    <span class="text-amber-400 font-semibold">₹12.5Cr</span>
                </div>
            </div>
        </header>

        <!-- Chat Thread (Scrollable) -->
        <div id="chat-thread" class="flex-1 overflow-y-auto p-6 space-y-6 max-w-5xl mx-auto w-full">
            <!-- Welcome Card -->
            <div class="bg-[#161224] border border-violet-900/40 rounded-2xl p-6 shadow-lg space-y-3">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-violet-600/20 rounded-lg">
                        <i data-lucide="zap" class="w-5 h-5 text-violet-400"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-white text-base">Ready to Analyze Crises</h2>
                        <p class="text-xs text-slate-400">Select scene, describe crisis, execute analysis</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Input Dock (Floating) -->
        <div class="p-6 max-w-5xl mx-auto w-full flex-shrink-0">
            <div class="bg-[#161224] border border-violet-800/40 rounded-2xl p-4 shadow-2xl backdrop-blur-xl space-y-4">

                <!-- Scene & Templates Row -->
                <div class="flex items-center gap-3 flex-wrap pb-3 border-b border-violet-900/30">
                    <div class="flex items-center gap-2">
                        <i data-lucide="film" class="w-4 h-4 text-violet-400"></i>
                        <select id="scene-selector" class="bg-[#1C1733] text-slate-200 border border-violet-900/50 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-violet-500">
                            <option value="sc_42">sc_42: Reunion at High Tide</option>
                            <option value="sc_18">sc_18: Night Highway Chase</option>
                            <option value="sc_09">sc_09: Soundstage Interior</option>
                            <option value="sc_25">sc_25: Police Interrogation</option>
                            <option value="sc_14">sc_14: Maya Solo Monologue</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-2 overflow-x-auto">
                        <span class="text-xs text-slate-400 whitespace-nowrap">Templates:</span>
                        <button onclick="applyTemplate('Equipment Damaged')" class="px-3 py-1.5 bg-[#221B3D] hover:bg-violet-900/40 border border-violet-800/30 rounded-lg text-slate-300 text-xs whitespace-nowrap">Equipment</button>
                        <button onclick="applyTemplate('Lead Actor Sick')" class="px-3 py-1.5 bg-[#221B3D] hover:bg-violet-900/40 border border-violet-800/30 rounded-lg text-slate-300 text-xs whitespace-nowrap">Actor</button>
                        <button onclick="applyTemplate('Weather Alert')" class="px-3 py-1.5 bg-[#221B3D] hover:bg-violet-900/40 border border-violet-800/30 rounded-lg text-slate-300 text-xs whitespace-nowrap">Weather</button>
                        <button onclick="applyTemplate('Location Blocked')" class="px-3 py-1.5 bg-[#221B3D] hover:bg-violet-900/40 border border-violet-800/30 rounded-lg text-slate-300 text-xs whitespace-nowrap">Location</button>
                    </div>
                </div>

                <!-- Crisis Input -->
                <textarea id="crisis-input" rows="2" placeholder="Describe the crisis or constraints..." class="w-full bg-[#0D0B18] text-slate-200 text-sm border border-violet-900/50 rounded-xl p-3 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500/30 resize-none placeholder-slate-500"></textarea>

                <!-- Mode & Submit -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-slate-400">Mode:</span>
                        <button id="btn-quick" onclick="setMode('quick')" class="mode-btn active px-3 py-1.5 rounded-lg border text-xs font-medium">Quick</button>
                        <button id="btn-deep" onclick="setMode('deep')" class="mode-btn px-3 py-1.5 rounded-lg border text-xs font-medium">Deep</button>
                        <button id="btn-next" onclick="setMode('next_steps')" class="mode-btn px-3 py-1.5 rounded-lg border text-xs font-medium">Next Steps</button>
                    </div>

                    <button id="submit-btn" onclick="submitCrisis()" class="flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 active:from-violet-700 active:to-indigo-700 text-white rounded-xl font-medium shadow-lg shadow-violet-900/40 transition-all duration-200 text-sm">
                        <i data-lucide="send" class="w-4 h-4"></i>
                        <span>Analyze Crisis</span>
                    </button>
                </div>

            </div>
        </div>

    </main>

    <script src="/static/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initializeApp();
        });
    </script>
</body>
</html>
