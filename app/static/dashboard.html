<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlow — Production Crisis Director</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0f172a;
            --bg-darker: #0a0e1a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background-color: var(--bg-darker);
            padding: 2rem 1.5rem;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .sidebar h1 {
            font-size: 1.4rem;
            letter-spacing: 3px;
            color: var(--accent-blue);
            margin-bottom: 2rem;
        }

        .nav-section {
            margin-bottom: 2rem;
        }

        .nav-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .nav-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background-color: var(--card-bg);
            border-left-color: var(--accent-blue);
        }

        .nav-item.active {
            background-color: var(--card-bg);
            border-left-color: var(--accent-red);
            color: var(--accent-red);
            font-weight: bold;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .screen {
            display: none;
            animation: fadeIn 0.3s;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .header h2 {
            font-size: 2rem;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Screen 1: Production Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stat-card h3 {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .crisis-alert {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid var(--accent-red);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .crisis-alert h3 {
            color: var(--accent-red);
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .crisis-alert p {
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .btn {
            padding: 0.85rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--accent-red);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--border-color);
            color: var(--text-light);
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .btn-success {
            background: var(--accent-green);
            color: white;
        }

        /* Screen 2: Crisis Detection */
        .crisis-card {
            background: var(--card-bg);
            border: 2px solid var(--accent-red);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .crisis-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .crisis-card h3 {
            color: var(--accent-red);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .crisis-details {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-muted);
            font-weight: bold;
        }

        .detail-value {
            color: var(--text-light);
        }

        /* Screen 3: Investigation Progress */
        .investigation-steps {
            margin-bottom: 2rem;
        }

        .step {
            display: flex;
            margin-bottom: 1.5rem;
            align-items: flex-start;
        }

        .step-number {
            width: 40px;
            height: 40px;
            background: var(--accent-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 1rem;
            flex-shrink: 0;
        }

        .step.completed .step-number {
            background: var(--accent-green);
        }

        .step.active .step-number {
            background: var(--accent-amber);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .step-content {
            flex: 1;
        }

        .step-title {
            color: var(--text-light);
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .step-detail {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .progress-bar {
            background: var(--border-color);
            height: 8px;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .progress-fill {
            background: var(--accent-green);
            height: 100%;
            transition: width 0.3s;
        }

        /* Screen 4: Recovery Decision */
        .recommendation-box {
            background: var(--card-bg);
            border-left: 4px solid var(--accent-green);
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .recommendation-box h3 {
            color: var(--accent-green);
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .recommendation-reason {
            background: rgba(16, 185, 129, 0.05);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .reason-list {
            list-style: none;
        }

        .reason-list li {
            padding: 0.5rem 0;
            color: var(--text-light);
        }

        .reason-list li:before {
            content: "✓ ";
            color: var(--accent-green);
            font-weight: bold;
            margin-right: 0.5rem;
        }

        .evidence-section {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .evidence-section h4 {
            color: var(--accent-blue);
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .evidence-item {
            background: rgba(59, 130, 246, 0.05);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 0.75rem;
            border-left: 3px solid var(--accent-blue);
        }

        .evidence-title {
            font-weight: bold;
            color: var(--text-light);
            margin-bottom: 0.25rem;
        }

        .evidence-url {
            color: var(--accent-blue);
            font-size: 0.85rem;
            text-decoration: none;
            word-break: break-all;
        }

        .evidence-url:hover {
            text-decoration: underline;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .action-buttons .btn {
            flex: 1;
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--accent-amber);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            margin-top: 1rem;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                width: 200px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 1rem;
            }

            .main-content {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <h1>🎬 CINEFLOW</h1>
        
        <div class="nav-section">
            <div class="nav-section-title">Workflow</div>
            <div class="nav-item active" onclick="showScreen('dashboard')">
                📊 Production Dashboard
            </div>
            <div class="nav-item" onclick="showScreen('crisis')">
                🚨 Crisis Detection
            </div>
            <div class="nav-item" onclick="showScreen('investigation')">
                🔍 Investigation
            </div>
            <div class="nav-item" onclick="showScreen('decision')">
                ✓ Recovery Decision
            </div>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">Tools</div>
            <div class="nav-item" onclick="downloadReport()">
                📥 Download Report
            </div>
            <div class="nav-item" onclick="resetAnalysis()">
                🔄 New Analysis
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Screen 1: Production Dashboard -->
        <div class="screen active" id="dashboard">
            <div class="header">
                <h2>Production Dashboard</h2>
                <p>Project Aurora • Production Day 7</p>
            </div>

            <div class="dashboard-grid">
                <div class="stat-card">
                    <h3>Scenes Today</h3>
                    <div class="stat-value">5
